name: CI — FinTrack Consolidated

on:
  push:
    branches: [main]
    paths: ['consolidated/**']
  pull_request:
    branches: [main]
    paths: ['consolidated/**']

jobs:
  # ==========================================
  # Frontend checks
  # ==========================================
  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consolidated/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consolidated/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(du -sk dist/index.html | cut -f1)
          echo "Bundle size: ${SIZE}KB"
          if [ "$SIZE" -gt 3000 ]; then
            echo "⚠️ Warning: bundle exceeds 3MB"
          fi

  # ==========================================
  # Backend checks
  # ==========================================
  backend:
    name: Backend (TypeScript + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consolidated/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: consolidated/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret-for-ci-pipeline-at-least-32-chars

      - name: Build
        run: npm run build

  # ==========================================
  # Docker build test
  # ==========================================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t fintrack-backend:test -f consolidated/backend/Dockerfile consolidated/backend

      - name: Build frontend image
        run: docker build -t fintrack-frontend:test -f consolidated/Dockerfile.frontend consolidated

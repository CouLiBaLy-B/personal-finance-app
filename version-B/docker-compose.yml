version: "3.8"

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintrack2026}
      POSTGRES_DB: fintrack
    volumes:
      - fintrack-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://fintrack:${DB_PASSWORD:-fintrack2026}@db:5432/fintrack?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/v1/auth/google/callback}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173,http://localhost:4173}
      UPLOAD_DIR: /app/uploads
      FX_API_KEY: ${FX_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    command: ["node", "dist/index.js"]

  # Frontend (Vite static build)
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fintrack-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  fintrack-data:
